name: Change proposal
description: Propose a bounded change to public MarketSpec behavior, fixtures, or contributor-facing docs
title: "[proposal] "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What public user or contributor problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Contract or evidence semantics
      description: If behavior changes, describe the affected contract/evidence semantics. For docs-only changes, say "docs-only".
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Deterministic acceptance condition
      description: What observable result would make this change complete and reproducible?
    validations:
      required: true
  - type: textarea
    id: fixtures
    attributes:
      label: Public fixtures or examples
      description: What bounded public fixtures/examples can demonstrate the change without live private data?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Briefly note simpler alternatives or why the change belongs in MarketSpec rather than a hosted/private service.
  - type: checkboxes
    id: boundary
    attributes:
      label: Scope boundary
      options:
        - label: The proposal does not require private ResolveOps workflow data or proprietary Curren research.
          required: true
        - label: I can describe and review the change using public repository evidence.
          required: true
